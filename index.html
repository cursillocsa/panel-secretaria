<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<style>

.cs-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.cs-k{background:#f3f5f9;border-radius:10px;padding:10px}.cs-k span{font-size:11px;color:#666;text-transform:uppercase;display:block}.cs-k b{font-size:19px}
.cs-sem{display:flex;gap:6px;flex-wrap:wrap}.cs-sem button{flex:1;min-width:120px;border:1px solid #bbb;background:#fff;border-radius:18px;padding:8px 10px;font-size:14px;cursor:pointer;font-family:inherit}.cs-sem button.on{background:#1f4e79;color:#fff;border-color:#1f4e79}

:root{--rojo:#c0392b;--negro:#201e1e;--fondo:#f3f5f9;--verde:#1b8a3a;--azul:#1f4e79}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222;font-size:16px}
header{background:var(--negro);color:#fff;padding:14px 16px;border-bottom:4px solid var(--rojo);display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px;flex:1}header h1 span{color:#ff6b5e}
#volver{display:none;background:#444;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
main{padding:14px 16px 70px;max-width:820px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--azul)}
.botones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bgrande{display:block;text-align:left;border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:bold;cursor:pointer;color:#fff;text-decoration:none;min-height:96px}
.bgrande small{display:block;font-weight:normal;font-size:13px;opacity:.9;margin-top:6px}
.b1{background:var(--azul)}.b2{background:var(--rojo)}.bx{background:#9e9e9e;cursor:default}
label{display:block;font-weight:bold;margin-top:12px;font-size:14px}
label .req{color:var(--rojo)}
input,select,textarea{width:100%;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px;background:#fff;font-family:inherit}
input[type=checkbox]{width:auto;transform:scale(1.4);margin-right:8px}
.fila{display:flex;gap:12px}.fila>div{flex:1;min-width:0}
@media(max-width:600px){.fila{flex-direction:column;gap:0}}
.btn{display:block;width:100%;font-size:18px;padding:14px;background:var(--rojo);color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:bold;margin-top:16px}
.btn:disabled{opacity:.6}.btn.az{background:var(--azul)}.btn.gr{background:#666}.btn.vd{background:#25d366}
.ayuda{color:#777;font-size:13px;font-weight:normal}
.err{color:var(--rojo);font-weight:bold;margin-top:10px}
.res div{padding:11px 12px;border:1px solid #eee;border-radius:8px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.res small{color:#777}
.mini{font-size:14px;padding:8px 12px;border:0;border-radius:8px;background:var(--azul);color:#fff;cursor:pointer;white-space:nowrap}
.aviso{background:#fff2cc;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.ok{background:#d9ead3;border-radius:12px;padding:16px}
.ok b.big{font-size:20px;display:block;margin-bottom:6px}
#msg{color:#666;text-align:center;margin-top:30px}
.paso{display:inline-block;background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-right:6px;font-size:14px}
header h1 span.tit{color:inherit}h1 .tit{cursor:pointer;-webkit-tap-highlight-color:transparent}h1 .tit:active{opacity:.6}

<header><h1><span class="tit" onclick="if(L)inicio()" title="Ir al inicio">🏫 Panel de secretaría <span>Gauss</span></span></h1><button id="volver" onclick="inicio()">⬅ Inicio</button></header>
<main><div id="app"></div><div id="msg">Cargando…</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';
var PANEL_COBRO='https://cursillocsa.github.io/pagos/';
var PIN='';try{PIN=localStorage.getItem('gaussPinSec')||'';}catch(e){}
var L=null,FORM=null,EST={};
// ⚡ Supabase: copia rápida de la lista y de los formularios. Si falla, se usa la planilla como siempre.
var SB_URL='https://heycvwxaewjbwbusddqg.supabase.co',SB_KEY='sb_publishable_MpClcQrbgiAtqcsaa5js3w_XCYqHztI',FORMS_NUEVOS=null;
function sbLeer(tipo,clave,ok,mal){
 if(!PIN){mal();return;}
 var hecho=false,to=setTimeout(function(){if(!hecho){hecho=true;mal();}},4000);
 fetch(SB_URL+'/rest/v1/rpc/gauss_leer',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
  body:JSON.stringify({p_pin:PIN,p_tipo:tipo,p_clave:clave})})
 .then(function(r){return r.json();})
 .then(function(d){if(hecho)return;hecho=true;clearTimeout(to);if(d&&d.datos)ok(d.datos,d.t);else mal();})
 .catch(function(){if(hecho)return;hecho=true;clearTimeout(to);mal();});}
var NAV=0,TOCADO=false,NUEVO=null;
function estable(o){if(Array.isArray(o))return '['+o.map(estable).join(',')+']';
 if(o&&typeof o==='object')return '{'+Object.keys(o).filter(function(k){return k!=='_ms'&&k!=='_total'&&o[k]!==undefined;}).sort()
  .map(function(k){return JSON.stringify(k)+':'+estable(o[k]);}).join(',')+'}';
 return JSON.stringify(o);}
function haceCuanto(t){var m=Math.round((Date.now()-new Date(t).getTime())/60000);return isNaN(m)?'':(m<1?'recién':m<60?'hace '+m+' min':'hace '+Math.round(m/60)+' h');}
function sbMarca(h){var m=el('sbMarca');if(!m){m=document.createElement('div');m.id='sbMarca';m.style.cssText='font-size:12px;color:#777;text-align:center;margin:0 0 8px';
  var a=el('app');a.parentNode.insertBefore(m,a);}m.innerHTML=h||'';}
// Muestra la copia de Supabase al instante y después confirma con la planilla.
// "refresco" (opcional): qué hacer con los datos nuevos de la planilla (si no, se vuelve a usar "ok").
function rapido(acc,params,tipo,clave,ok,mal,refresco){
 var n=++NAV;sbMarca('');
 sbLeer(tipo,clave,function(d,t){
  if(n!==NAV)return;TOCADO=false;ok(d);sbMarca('⚡ Vista rápida · confirmando con la planilla…');
  pedir(acc,params,function(D){
   if(n!==NAV)return;
   if(estable(D)===estable(d)){sbMarca('✅ Confirmado con la planilla');setTimeout(function(){if(n===NAV)sbMarca('');},2500);return;}
   var aplicar=function(){var y=window.scrollY;(refresco||ok)(D);window.scrollTo(0,y);sbMarca('');};
   if(!TOCADO||refresco){aplicar();return;}
   NUEVO=aplicar;sbMarca('<b style="color:#b45f06">🔄 La planilla tiene datos más nuevos.</b> <button onclick="NUEVO()" style="font-size:12px">Actualizar</button>');
  },function(e){if(n!==NAV)return;if(String(e.message||'').indexOf('PIN:')>=0){mal(e);return;}
   sbMarca('<span style="color:#c0392b">⚠️ No se pudo confirmar con la planilla (se ve la vista rápida).</span>');});
 },function(){if(n===NAV)pedir(acc,params,function(D){if(n===NAV)ok(D);},function(e){if(n===NAV)mal(e);});});}
function hoyLocal(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
// Guarda los formularios ya cargados (así al tocar un botón se abre al instante).
function ponerForms(d){if(!d)return;var ok=function(x){if(!x||x.error)return null;if(x.hoy)x.hoy=hoyLocal();return x;};
 FORM=ok(d.formInscripcion)||FORM;FJ=ok(d.formJustificativo)||FJ;FG=ok(d.formGasto)||FG;FB=ok(d.formBaja)||FB;FL=ok(d.formLibros)||FL;}
function enInicio(){return el('volver').style.display!=='inline-block';}
function formsDePlanilla(){pedir('formsTodos',{},function(d){if(enInicio()||!FORM)ponerForms(d);else FORMS_NUEVOS=d;},function(){});}
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sa(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function gs(n){n=Number(n)||0;return 'Gs. '+Math.round(n).toLocaleString('es-PY');}
function num(s){return Number(String(s).replace(/[^0-9]/g,''))||0;}
function fmt(i){var n=num(i.value);i.value=n?n.toLocaleString('es-PY'):(/0/.test(i.value)?'0':'');}   // se puede escribir 0
function fecha(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}
function msg(t){el('msg').innerHTML=t||'';}
function pedir(acc,params,ok,mal){
 var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 fetch(API+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar con Administración. Revisá la conexión y probá de nuevo.'});});}
function falla(e,dest){var m=String(e.message||e);
 if(m.indexOf('PIN:')>=0){pedirPin(m.replace(/^.*PIN:\s*/,''));return true;}
 if(dest)el(dest).innerHTML='<div class="err">⚠️ '+esc(m)+'</div>';else msg('<span class="err">⚠️ '+esc(m)+'</span>');return false;}
function pedirPin(m){el('volver').style.display='none';msg('');
 el('app').innerHTML='<div class="card" style="text-align:center"><h2>🔒 Panel de secretaría</h2><div style="margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'">'+esc(m)+'</div>'+
 '<input id="pin" type="password" placeholder="PIN" style="font-size:22px;width:180px;text-align:center"><br><button class="btn" style="width:auto;display:inline-block;padding:12px 34px" onclick="entrar()">Entrar</button></div>';
 var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}
function entrar(){PIN=el('pin').value.trim();guardado('gaussPinSec',PIN);cargar();}

function cargar(){el('app').innerHTML='';msg('Cargando…');
 sbLeer('pagosLista','todo',function(d){L=d;inicio();
   pedir('lista',{},function(d2){L=d2;},function(e){if(String(e.message||'').indexOf('PIN:')>=0)falla(e);});},
  function(){pedir('lista',{},function(d){L=d;inicio();},function(e){falla(e);});});
 // formularios: primero la copia rápida, después los de la planilla (por si se agregó un grupo, un motivo, etc.)
 sbLeer('secForms','todo',function(d){ponerForms(d);formsDePlanilla();},formsDePlanilla);
 cargarRevisar();}
el('app').addEventListener('input',function(){TOCADO=true;});
cargar();

// ---------- 💰 COBRANZA (Liz y Osvaldo) ----------
var COB=null,COB_F=guardado('gaussCobF')||'cuotas2',COB_G='',COB_O=guardado('gaussCobO')||'deuda',COB_AB={},COB_V=[];
function cobranza(){pantalla('<div class="card">Cargando panel de deudas… (unos segundos)</div>');
 rapido('cobranza',{},'cobranza','todo',function(d){COB=d;pintarCob();},function(e){falla(e);});}
function cK(t,v,sub,col){return '<div style="background:'+(col||'#f3f5f9')+';border-radius:10px;padding:10px"><div style="font-size:11px;color:#555;text-transform:uppercase">'+t+'</div>'+
 '<div style="font-size:20px;font-weight:bold;margin-top:2px">'+v+'</div>'+(sub?'<div class="ayuda" style="margin-top:2px">'+sub+'</div>':'')+'</div>';}
function cobFiltrar(){var F=COB_F;return COB.alumnos.filter(function(x){
  if(F==='salidos')return !x.activo;if(!x.activo)return false;
  if(F==='cuotas2')return x.impagas>=2;if(F==='meses2')return x.atraso>=2;return true;}).filter(function(x){return !COB_G||x.grupo===COB_G;});}
function cobOrden(l){var o=COB_O,pr=function(x){return !x.promesa?3:x.promesa.estado==='vencida'?0:x.promesa.estado==='vigente'?1:2;};
 var nom=function(a,b){return a.nombre.localeCompare(b.nombre,'es');};
 return l.sort(function(a,b){
  if(o==='apellido')return nom(a,b);
  if(o==='grupo')return a.grupo.localeCompare(b.grupo,'es',{numeric:true})||nom(a,b);
  var ao=function(x){var c=x.asis?x.asis.c:'';return c==='no'?0:c==='poco'?1:c==='si'?2:3;};
  var d=o==='asistencia'?ao(a)-ao(b):o==='atraso'?b.dias-a.dias:o==='contacto'?((b.ultimo?b.ultimo.dias:9999)-(a.ultimo?a.ultimo.dias:9999)):o==='promesa'?pr(a)-pr(b):0;
  return d||b.deuda-a.deuda||nom(a,b);});}
function pintarCob(){if(!COB)return;var c=COB.cobrado,t=COB.tablero,m=COB.meta;
 var h='<div class="card"><h2>💰 Panel de deudas · '+esc(COB.mes)+'</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px">'+
  cK('Deuda de meses anteriores',gs(t.antAct),t.antActN+' alumnos','#f4cccc')+
  cK('Deuda de este mes',gs(t.mesAct),'ya vencido: '+gs(t.mesVencAct)+' · '+t.mesActN+' alumnos','#fff2cc')+
  cK('Cobrado esta semana',gs(c.semAnt+c.semMes),'de deudas anteriores '+gs(c.semAnt)+'<br>del mes '+gs(c.semMes),'#d9ead3')+
  cK('Cobrado este mes',gs(c.mesAnt+c.mesMes),'de deudas anteriores '+gs(c.mesAnt)+'<br>del mes '+gs(c.mesMes),'#d9ead3')+'</div>'+
  '<div class="ayuda" style="margin-top:6px">Semana: '+esc(COB.semana)+' (lunes a sábado). "De deudas anteriores" = lo que se cobró de cuotas de meses anteriores. Solo alumnos activos.</div>'+
  (t.salidosN?'<div class="ayuda" style="margin-top:4px">🚪 Los que ya salieron deben '+gs(t.salidos)+' ('+t.salidosN+' alumnos) · <a href="javascript:void 0" onclick="cobF(\'salidos\')">ver</a></div>':'');
 // meta
 if(m&&m.monto){var hecho=m.cuenta==='todo'?c.mesAnt+c.mesMes:c.mesAnt,pct=Math.min(100,Math.round(hecho*100/m.monto));
  h+='<div style="margin-top:12px"><b>🎯 Meta de '+esc(COB.mes)+':</b> '+(m.cuenta==='todo'?'cobrar ':'recuperar ')+gs(m.monto)+(m.cuenta==='todo'?' en total':' de deudas anteriores')+
   '<div style="background:#eee;border-radius:10px;height:22px;margin-top:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>=100?'#1b8a3a':'#2e86c1')+';color:#fff;font-size:13px;font-weight:bold;line-height:22px;padding-left:8px;white-space:nowrap">'+pct+'%</div></div>'+
   '<div class="ayuda" style="margin-top:4px">Vamos '+gs(hecho)+' de '+gs(m.monto)+(hecho<m.monto?' · faltan '+gs(m.monto-hecho):' · ¡meta cumplida! 🎉')+(m.por?' · puesta por '+esc(m.por)+(m.fecha?' ('+esc(m.fecha)+')':''):'')+
   ' · <a href="javascript:void 0" onclick="formMeta()">✏️ cambiar</a></div></div>';}
 else h+='<button class="mini" style="margin-top:12px;background:#2e86c1" onclick="formMeta()">🎯 Poner meta del mes</button>';
 h+='<div id="cobMeta"></div></div>';
 // filtros
 var l=cobOrden(cobFiltrar()),tot=l.reduce(function(s,x){return s+x.deuda;},0),grupos={};
 COB.alumnos.filter(function(x){return COB_F==='salidos'?!x.activo:x.activo;}).forEach(function(x){var g=grupos[x.grupo||'Sin grupo']||(grupos[x.grupo||'Sin grupo']={n:0,d:0});
  if(COB_F==='cuotas2'&&x.impagas<2||COB_F==='meses2'&&x.atraso<2)return;g.n++;g.d+=x.deuda;});
 var chip=function(v,t){return '<button class="mini" style="'+(COB_F===v?'':'background:#e8eef6;color:#1f4e79')+'" onclick="cobF(\''+v+'\')">'+t+'</button>';};
 h+='<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap">'+chip('cuotas2','⚠️ 2+ cuotas vencidas')+chip('meses2','⏰ 2+ meses de atraso')+chip('todos','Todos los que deben')+chip('salidos','🚪 Ya salieron')+'</div>'+
  '<div class="fila" style="margin-top:6px"><div><label>Grupo</label><select onchange="COB_G=this.value;pintarCob()"><option value="">Todos los grupos</option>'+
  Object.keys(grupos).sort(function(a,b){return a.localeCompare(b,'es',{numeric:true});}).map(function(g){return '<option value="'+esc(g)+'"'+(g===COB_G?' selected':'')+'>'+esc(g)+' ('+grupos[g].n+')</option>';}).join('')+'</select></div>'+
  '<div><label>Ordenar por</label><select onchange="COB_O=this.value;guardado(\'gaussCobO\',COB_O);pintarCob()">'+
  [['deuda','Más deuda'],['atraso','Más atraso'],['asistencia','Asistencia (los que no vienen primero)'],['contacto','Hace más que no se le escribe'],['promesa','Promesas primero'],['grupo','Grupo'],['apellido','Apellido']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===COB_O?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div></div>'+
  '<div style="margin-top:10px;font-weight:bold">'+l.length+' alumno'+(l.length===1?'':'s')+' · '+gs(tot)+'</div>'+
  (!COB_G&&Object.keys(grupos).length>1?'<details style="margin-top:6px"><summary class="ayuda" style="cursor:pointer">📊 Ver por grupo</summary><table style="width:100%;font-size:14px;margin-top:6px;border-collapse:collapse">'+
   Object.keys(grupos).sort(function(a,b){return grupos[b].d-grupos[a].d;}).map(function(g){return '<tr style="cursor:pointer;border-bottom:1px solid #eee" onclick="COB_G=\''+esc(g).replace(/'/g,"\\'")+'\';pintarCob()"><td style="padding:5px">'+esc(g)+'</td><td>'+grupos[g].n+'</td><td style="text-align:right">'+gs(grupos[g].d)+'</td></tr>';}).join('')+'</table></details>':'')+'</div>';
 if(!l.length)h+='<div class="card"><div class="ayuda">✓ Nadie con este filtro.</div></div>';
 l.forEach(function(x,i){var k='cb'+i,ab=!!COB_AB[x.id],p=x.promesa,u=x.ultimo;
  var est=p&&p.estado==='vigente'?'<span style="background:#fff2cc;border-radius:8px;padding:2px 8px">🤝 Prometió pagar el <b>'+esc(p.fecha)+'</b>'+(p.pagado?' · ya pagó '+gs(p.pagado):'')+'</span>'
   :p&&p.estado==='vencida'?'<span style="background:#f4cccc;border-radius:8px;padding:2px 8px;color:#990000">⚠️ <b>Promesa vencida</b> ('+esc(p.fecha)+') y no pagó</span>'
   :p&&p.estado==='pagó algo'?'<span class="ayuda">🤝 Prometió para el '+esc(p.fecha)+' · pagó '+gs(p.pagado)+'</span>':'';
  var con=u?'<span class="ayuda">Último contacto: '+esc(u.fecha)+' ('+(u.dias===0?'hoy':'hace '+u.dias+' día'+(u.dias>1?'s':''))+') · '+esc(u.quien)+(u.obs?' · '+esc(u.obs):'')+'</span>':'<span style="color:#b45f06;font-size:13px">⚠️ Todavía no se le escribió</span>';
  h+='<div class="card" style="'+(p&&p.estado==='vencida'?'border-left:5px solid #c0392b':u&&u.dias<=2?'border-left:5px solid #1b8a3a':'')+'">'+
   '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b style="font-size:16px">'+esc(x.nombre)+'</b><div class="ayuda">'+esc(x.id)+' · '+esc(x.grupo||'sin grupo')+(x.activo?'':' · '+esc(x.estado))+'</div></div>'+
   '<div style="text-align:right"><b style="font-size:17px;color:#c0392b">'+gs(x.deuda)+'</b><div class="ayuda">'+(x.impagas?x.impagas+' cuota'+(x.impagas>1?'s':''):'')+(x.dias?' · '+x.dias+' días de atraso':'')+'</div></div></div>'+
   '<div style="margin-top:4px;font-size:14px">'+esc(x.detalle)+'</div>'+

  if(r.tipo==='cambio'){d.innerHTML='<div style="background:#fff;border-radius:8px;padding:10px;margin-top:6px">Cuota que tiene ahora: <b>'+gs(r.cuota)+'</b>'+(r.cuotaGrupo!==null?' · cuota del grupo nuevo: <b>'+gs(r.cuotaGrupo)+'</b>':'')+
   '<label>Cuota en el grupo nuevo (Gs.)</label><input id="rvC'+fila+'" inputmode="numeric" oninput="fmt(this)" value="'+(r.cuotaGrupo!==null?Number(r.cuotaGrupo).toLocaleString('es-PY'):Number(r.cuota).toLocaleString('es-PY'))+'">'+
   '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="mini" onclick="revisarOk('+fila+',\'cuota\')">💾 Guardar cuota</button><button class="mini" onclick="revisarOk('+fila+',\'ok\')">✔ Dejar como está</button></div></div>';return;}
  d.innerHTML='<div style="background:#fff;border-radius:8px;padding:10px;margin-top:6px"><b>¿Hasta dónde se cobra?</b>'+
   '<label style="font-weight:normal;display:block;margin-top:6px"><input type="radio" name="rvS'+fila+'" value="ultima" checked style="width:auto"> Último día que vino'+(r.ultima?' ('+fecha(r.ultima)+')':'')+' → debe <b>'+gs(r.deudaUlt||0)+'</b></label>'+
   '<label style="font-weight:normal;display:block;margin-top:6px"><input type="radio" name="rvS'+fila+'" value="aviso" style="width:auto"> Día que avisó'+(r.aviso?' ('+fecha(r.aviso)+')':'')+' → debe <b>'+gs(r.deudaAviso||0)+'</b></label>'+
   '<div style="margin-top:8px"><button class="mini" onclick="revisarOk('+fila+',\'salida\',\''+esc(r.ultima||'')+'\',\''+esc(r.aviso||'')+'\')">✔ Confirmar</button></div></div>';},
  function(e){d.innerHTML='<div class="err">'+esc(e.message||e)+'</div>';});}
function revisarOk(fila,accion,ult,av){var d=el('rv'+fila),p={fila:fila,que:accion,quien:guardado('gaussSecQuien')};
 if(accion==='cuota')p.cuota=num(val('rvC'+fila));
 if(accion==='salida'){var c=document.querySelector('input[name=rvS'+fila+']:checked'),v=c?c.value:'ultima';p.corte=v;p.fecha=v==='aviso'?av:ult;
  if(!p.fecha){d.insertAdjacentHTML('beforeend','<div class="err">Falta esa fecha.</div>');return;}
}
 d.innerHTML='<div class="ayuda">Guardando…</div>';
 pedir('revisarHecho',p,function(r){REV=(REV||[]).filter(function(x){return x.fila!==fila;});d.innerHTML='<div style="color:#1b8a3a;font-weight:bold">✅ '+esc(r.msg)+'</div>';
  setTimeout(function(){if(enInicio())inicio();},1500);},function(e){d.innerHTML='<div class="err">'+esc(e.message||e)+'</div>';});}

// ---------- ✏️ CORREGIR / ACTUALIZAR DATOS ----------
function editar(){PICK=null;
 var seguir=function(){
  pantalla(buscadorHtml('¿De qué alumno?')+'<div id="ed"></div>');
  PICK_CB=function(a){el('ed').innerHTML='<div class="card">Cargando sus datos…</div>';
   rapido('datosAlumno',{id:a[0]},'secDatos',a[0],function(r){EST.orig=r.valores;
    var obl=FORM.campos.filter(function(c){return c.req;}),otros=FORM.campos.filter(function(c){return !c.req;});
    el('ed').innerHTML='<div class="card"><h2><span class="paso">2</span>Datos de '+esc(a[1])+'</h2>'+
     '<div class="fila">'+obl.map(function(c){return '<div>'+campoHtml(c)+'</div>';}).join('')+'</div>'+
     otros.map(function(c,i){var t=/^(RUC|RAZ)/i.test(c.titulo)&&!(i>0&&/^(RUC|RAZ)/i.test(otros[i-1].titulo))?
      '<div style="margin-top:18px;padding-top:10px;border-top:1px solid #ddd;font-weight:bold;color:#1f4e79">🧾 Datos de facturación</div>':'';return t+campoHtml(c);}).join('')+
     '<div class="ayuda" style="margin-top:8px">Cambiá lo que haga falta. Si borrás un campo, se borra también en la planilla.</div>'+
     '<button class="btn" id="eB" onclick="guardarEdicion()">💾 Guardar cambios</button><div id="eM"></div></div>';
    FORM.campos.forEach(function(c){var e=el('al'+c.j),v=r.valores[c.j];if(!e||v===undefined)return;
     if(c.tipo==='check')e.checked=v===true||v==='TRUE';
     else if(c.tipo==='number')e.value=String(v).trim()===''?'':num(v).toLocaleString('es-PY');
     else if(c.tipo==='list'&&v!==''&&!c.ops.some(function(o){return o===v;})){e.innerHTML+='<option>'+esc(v)+'</option>';e.value=v;}
     else e.value=v;});
   },function(e){falla(e,'ed');});};
  el('pq').focus();};
 if(FORM)seguir();else{msg('Cargando…');pedir('formInscripcion',{},function(d){FORM=d;seguir();},function(e){falla(e);});}}
function guardarEdicion(){var a=PICK,m=el('eM'),d={},falta='';
 FORM.campos.forEach(function(c){var e=el('al'+c.j);if(!e)return;var v=c.tipo==='check'?e.checked:(c.tipo==='number'?(num(e.value)||''):e.value.trim());
  if(c.tipo==='number')v=e.value.trim()===''?'':num(e.value);
  if(c.req&&!v)falta=falta||c.titulo;d[c.j]=v;});
 if(falta){m.innerHTML='<div class="err">Falta: '+esc(falta)+'</div>';return;}
 // datos sensibles: nombre, apellido y CI (con eso se identifica al alumno en todas las hojas)
 var sens=[];FORM.campos.forEach(function(c){if(!/^(APELLIDO|NOMBRE|CI$|C\.I|CEDULA)/i.test(sa(c.titulo).toUpperCase()))return;
  var antes=String((EST.orig||{})[c.j]==null?'':EST.orig[c.j]).trim(),ahora=String(d[c.j]==null?'':d[c.j]).trim();
  if(sa(antes)!==sa(ahora))sens.push(c.titulo+': "'+antes+'" → "'+ahora+'"');});
 if(sens.length&&!confirm('⚠️ Vas a cambiar datos que identifican al alumno:\n\n'+sens.join('\n')+'\n\nSe va a actualizar en todas las hojas (CAJA, INSCRIPCIONES, AJUSTES…). ¿Seguro que está bien?'))return;
 if(!sens.length&&!confirm('¿Guardar los cambios de '+a[1]+'?'))return;
 var b=el('eB');b.disabled=true;b.textContent='Guardando…';
 pedir('actualizarAlumno',{id:a[0],datos:JSON.stringify(d)},function(r){
   if(L){var x=L.alumnos.filter(function(y){return y[0]===a[0];})[0];if(x)x[1]=r.nombre;}
   hecho(r.cambios?'Datos de '+esc(r.nombre)+' actualizados ('+r.cambios+' cambio'+(r.cambios>1?'s':'')+').'+(r.renombradas?'<br><span style="font-weight:normal;font-size:15px">El nombre nuevo se actualizó en '+r.renombradas+' registro(s) de CAJA, INSCRIPCIONES y AJUSTES.</span>':''):
    'No había nada distinto para guardar.','✏️ Corregir otro alumno','editar');},
  function(e){b.disabled=false;b.textContent='💾 Guardar cambios';falla(e,'eM');});}

// ---------- 📒 CARGAS DE LA SEMANA ----------
var CS_MODO='0';
function cargasSemana(){pantalla('<div class="card"><h2>📒 Cargas de la semana</h2><div class="cs-sem">'+
  '<button id="cs0" onclick="csIr(\'0\')">Esta semana</button><button id="cs1" onclick="csIr(\'1\')">Semana anterior</button><button id="csX" onclick="csIr(\'x\')">Elegir fechas</button></div>'+
  '<div id="csF" style="display:none;margin-top:8px"><div class="fila'+''+'"><div><label>Desde</label><input type="date" id="csD"></div><div><label>Hasta</label><input type="date" id="csH"></div></div>'+
  '<button class="btn" style="margin-top:10px" onclick="csVer({desde:el(\'csD\').value,hasta:el(\'csH\').value})">Ver</button></div>'+
  '<div class="ayuda" style="margin-top:6px">La semana va de sábado a viernes. <button class="mini" id="csOrd" onclick="csCambiarOrden()" style="margin-left:6px">'+csOrdTxt()+'</button></div></div><div id="csR"></div>');csIr(CS_MODO==='x'?'0':CS_MODO);}
// orden de las cargas: por defecto lo último cargado arriba (el servidor manda de más viejo a más nuevo)
var CS_ORDEN=guardado('gaussCsOrden')||'nuevo',CS_ULT=null;
function csOrdTxt(){return CS_ORDEN==='nuevo'?'↓ Más nuevos primero':'↑ Más viejos primero';}
function csCambiarOrden(){CS_ORDEN=CS_ORDEN==='nuevo'?'viejo':'nuevo';guardado('gaussCsOrden',CS_ORDEN);var b=el('csOrd');if(b)b.textContent=csOrdTxt();if(CS_ULT&&el('csR'))el('csR').innerHTML=csPintar(CS_ULT);}
function csOrdenar(R){var X={};Object.keys(R).forEach(function(k){X[k]=Array.isArray(R[k])&&k!=='medios'&&CS_ORDEN==='nuevo'?R[k].slice().reverse():R[k];});return X;}
function csIr(m){CS_MODO=m;['0','1','X'].forEach(function(k){var b=el('cs'+k);if(b)b.className=(k===m||(k==='X'&&m==='x'))?'on':'';});
 el('csF').style.display=m==='x'?'block':'none';if(m!=='x')csVer({anterior:m});}
function csVer(p){el('csR').innerHTML='<div class="card">Cargando… (unos segundos)</div>';
 CS_PEDIR('cargasSemana',p,function(R){el('csR').innerHTML=csPintar(R);if(el('csD')&&!el('csD').value){el('csD').value=R.desdeIso;el('csH').value=R.hastaIso;}},function(e){falla(e,'csR');});}
function csTabla(tit,enc,filas,der){der=der||[];return '<div class="card"><h2>'+tit+' <span class="ayuda">('+filas.length+')</span></h2>'+(filas.length?'<div style="overflow-x:auto"><table class="cs-tb"><tr>'+
  enc.map(function(e,i){return '<th'+(der.indexOf(i)>=0?' class="n"':'')+'>'+esc(e)+'</th>';}).join('')+'</tr>'+filas.map(function(f){return '<tr>'+f.map(function(c,i){return '<td'+(der.indexOf(i)>=0?' class="n"':'')+'>'+c+'</td>';}).join('')+'</tr>';}).join('')+
  '</table></div>':'<div class="ayuda">— nada cargado —</div>')+'</div>';}
function csK(t,v){return '<div class="cs-k"><span>'+esc(t)+'</span><b>'+v+'</b></div>';}
function csMil(n){return Math.round(Number(n)||0).toLocaleString('es-PY');}

function CS_PEDIR(a,p,ok,mal){if(p.desde||p.hasta){NAV++;sbMarca('');pedir(a,p,ok,mal);return;}rapido(a,p,'cargas',p.anterior==='1'?'anterior':'actual',ok,mal);}
function csPintar(R){CS_ULT=R;R=csOrdenar(R);var al=function(x){return esc(x.alumno)+' <span class="ayuda">'+esc(x.id)+'</span>';};
 var h='<div class="card"><h2>Del '+esc(R.desde)+' al '+esc(R.hasta)+'</h2><div class="cs-res">'+
  csK('Pagos',R.pagos.length+' · Gs. '+csMil(R.tot.pagos))+csK('Inscripciones',R.inscripciones.length)+csK('Cambios de grupo',R.cambios.length)+csK('Bajas',R.bajas.length)+
  csK('Ajustes',R.ajustes.length)+csK('Esperas',R.esperas.length)+csK('Gastos',R.gastos.length+' · Gs. '+csMil(R.tot.gastos))+csK('Anotaciones',R.anotaciones.length)+'</div>'+
  (R.medios.length?'<div class="ayuda" style="margin-top:8px">Por medio: '+R.medios.map(function(m){return esc(m[0])+' Gs. '+csMil(m[1]);}).join(' · ')+'</div>':'')+'</div>';
 h+=csTabla('💵 Pagos',['Día','Alumno','Monto','Medio','Tipo','Cobró','Comprobante'],R.pagos.map(function(x){return [esc(x.dia)+(x.pago?'<br><span class="ayuda">pagó '+esc(x.pago)+'</span>':''),al(x),csMil(x.monto),esc(x.medio),esc(x.tipo),esc(x.cobro),esc(x.comp)];}),[2]);
 h+=csTabla('📝 Inscripciones',['Día','Alumno','Tipo','Grupo','Inicio','Plan'],R.inscripciones.map(function(x){return [esc(x.dia),al(x),esc(x.tipo),esc(x.grupo),esc(x.inicio),esc(x.plan)];}));
 if(R.sinFechaCarga)h+='<div class="ayuda" style="margin:-8px 0 12px 4px">Las inscripciones se ven desde ahora: el panel anota la FECHA DE CARGA al inscribir.</div>';
 h+=csTabla('🔄 Cambios de grupo',['Día','Alumno','De','A'],R.cambios.map(function(x){return [esc(x.dia),al(x),esc(x.de),esc(x.a)];}));
 h+=csTabla('🚪 Bajas',['Salida','Alumno','Grupo','Motivo'],R.bajas.map(function(x){return [esc(x.dia),al(x),esc(x.grupo),esc(x.motivo)];}));
 h+=csTabla('✂️ Ajustes',['Día','Alumno','Tipo','Monto','Cuota','Motivo','Autorizó'],R.ajustes.map(function(x){return [esc(x.dia),al(x),esc(x.tipo),x.monto===''?'(entera)':csMil(x.monto),esc(x.mes),esc(x.motivo),esc(x.aut)];}),[3]);
 h+=csTabla('⏳ Esperas de cuotas',['Día','Alumno','Motivo','Cuotas','Hasta','Qué pasó','Anotó'],R.esperas.map(function(x){return [esc(x.dia),al(x),esc(x.motivo),esc(x.cuotas),esc(x.hasta),esc(x.que),esc(x.quien)];}));
 h+=csTabla('🧾 Gastos',['Día','Detalle','Monto','Medio'],R.gastos.map(function(x){return [esc(x.dia),esc(x.texto),csMil(x.monto),esc(x.medio)];}),[2]);
 h+=csTabla('📝 Anotaciones de cobranza',['Día','Alumno','Quién','Anotación'],R.anotaciones.map(function(x){return [esc(x.dia),al(x),esc(x.quien),esc(x.obs)];}));
 return h;}

// ---------- 📚 VENTA DE LIBROS ----------
var FL=null;
function conFL(fn){if(FL)fn();else{msg('Cargando…');pedir('formLibros',{},function(d){FL=d;msg('');fn();},function(e){falla(e);});}}
function opsL(l,sel){return '<option value=""></option>'+(l||[]).map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
// filas de libros + datos de cobro (k = prefijo: 'V' venta suelta, 'I' en la inscripción)
function bloqueLibros(k,conAlumno){
 if(!FL.libros.length)return '<div class="aviso">No encontré libros en la lista de TIPO de CAJA (tienen que decir "Libro…" o "Ejercitario…").</div>';
 var procDef=guardado('gaussSecProc')||(FL.proc.filter(function(p){return sa(p)===sa(FL.oficina);})[0])||'';
 return '<table style="width:100%;border-collapse:collapse;margin-top:6px">'+FL.libros.map(function(l,i){
   return '<tr style="border-bottom:1px solid #eee"><td style="padding:8px 4px"><b>'+esc(l.tipo)+'</b><br><span class="ayuda">Precio c/u</span> <input id="'+k+'p'+i+'" inputmode="numeric" oninput="fmt(this);totL(\''+k+'\')" value="'+(l.precio?Number(l.precio).toLocaleString('es-PY'):'')+'" style="width:120px;font-size:15px;padding:6px"></td>'+
    '<td style="text-align:right;white-space:nowrap"><button type="button" class="mini" onclick="cantL(\''+k+'\','+i+',-1)">−</button> <b id="'+k+'c'+i+'" style="display:inline-block;width:28px;text-align:center;font-size:18px">0</b> <button type="button" class="mini" onclick="cantL(\''+k+'\','+i+',1)">+</button></td></tr>';}).join('')+'</table>'+
  '<div style="font-size:18px;margin-top:8px">Total: <b id="'+k+'tot">Gs. 0</b></div>'+
  '<div class="fila"><div><label>Medio <span class="req">*</span></label><select id="'+k+'me">'+opsL(FL.medio,guardado('gaussLibMedio')||FL.medio.filter(function(m){return /efectivo/i.test(m);})[0])+'</select></div>'+
  '<div><label>Cobró</label><select id="'+k+'co">'+opsL(FL.cobro,guardado('gaussSecCobro'))+'</select></div></div>'+
  '<div class="fila"><div><label>Procesado en <span class="req">*</span></label><select id="'+k+'pr">'+opsL(FL.proc,procDef)+'</select></div>'+
  '<div><label>Comprobante</label><select id="'+k+'tc" onchange="factL(\''+k+'\','+(conAlumno?1:0)+')">'+opsL(FL.tipoComp,FL.tipoComp.filter(function(t){return /recibo/i.test(t);})[0]||'')+'</select></div></div>'+
  '<div id="'+k+'fx"></div>';}
function cantL(k,i,d){var e=el(k+'c'+i),n=Math.max(0,(Number(e.textContent)||0)+d);e.textContent=n;totL(k);}
function totL(k){var t=0;FL.libros.forEach(function(l,i){t+=(Number(el(k+'c'+i).textContent)||0)*num(el(k+'p'+i).value);});el(k+'tot').textContent=gs(t);}
function factL(k,conAlumno){var f=/factura/i.test(el(k+'tc').value),x=el(k+'fx');
 x.innerHTML=f?'<div class="fila"><div><label>N° de factura <span class="ayuda">(si ya la hiciste)</span></label><input id="'+k+'nf"></div></div>'+
  (conAlumno?'':'<div class="fila"><div><label>RUC <span class="req">*</span></label><input id="'+k+'ruc"></div><div><label>Razón social <span class="req">*</span></label><input id="'+k+'raz"></div></div>'+
   '<div class="ayuda">Si es alumno, mejor elegilo arriba: se usan sus datos de facturación.</div>'):'';}
function leerVenta(k,id){var items=[],det=[],tot=0;
 FL.libros.forEach(function(l,i){var c=Number(el(k+'c'+i).textContent)||0,p=num(el(k+'p'+i).value);if(c>0){items.push({tipo:l.tipo,cant:c,precio:p});det.push(c+' × '+l.tipo);tot+=c*p;}});
 if(!items.length)return {error:'Elegí al menos un libro (tocá +).'};
 if(items.some(function(x){return !x.precio;}))return {error:'Falta el precio de algún libro.'};
 if(!el(k+'me').value)return {error:'Elegí el medio de pago.'};
 if(!el(k+'pr').value)return {error:'Elegí PROCESADO EN.'};
 var tc=el(k+'tc').value,q={items:JSON.stringify(items),medio:el(k+'me').value,cobro:el(k+'co').value,proc:el(k+'pr').value,tipoComp:tc,
  comp:el(k+'nf')?el(k+'nf').value.trim():'',id:id||'',nonce:Date.now()+'-'+Math.random().toString(36).slice(2)};
 if(el(k+'ruc')){q.factRuc=el(k+'ruc').value.trim();q.factRazon=el(k+'raz').value.trim();if(/factura/i.test(tc)&&!id&&(!q.factRuc||!q.factRazon))return {error:'Para factura sin alumno, completá RUC y razón social.'};}
 guardado('gaussLibMedio',q.medio);guardado('gaussSecCobro',q.cobro);guardado('gaussSecProc',q.proc);
 return {params:q,detalle:det.join(' · '),total:tot};}
function incLibros(){var on=el('incL').checked;if(!on){el('libI').innerHTML='';return;}
 conFL(function(){el('libI').innerHTML=bloqueLibros('I',true)+'<div class="ayuda">Se cargan en CAJA a nombre del alumno, apenas se guarda la inscripción.</div>';});}
function libros(){conFL(function(){PICK=null;PICK_CB=null;
 pantalla('<div class="card"><h2>📚 Venta de libros</h2>'+bloqueLibros('V',false)+
  '<label style="margin-top:14px"><input type="checkbox" id="Val" onchange="libAlumno()"> Es un alumno <span class="ayuda">(opcional: solo si querés que quede a su nombre o pide factura con sus datos)</span></label><div id="Vbus"></div>'+
  '<label>Observación <span class="ayuda">(opcional)</span></label><input id="Vob">'+
  '<button class="btn" id="Vb" onclick="venderL()">📚 Guardar venta</button><div id="Vm"></div></div>');});}
function libAlumno(){var on=el('Val').checked;PICK=null;
 el('Vbus').innerHTML=on?'<input id="pq" placeholder="Escribí apellido, nombre o ID…" oninput="pBuscar()" autocomplete="off"><div id="pres" class="res"></div><div id="psel"></div>':'';
 factL('V',on?1:0);if(on)el('pq').focus();}
function venderL(){var m=el('Vm'),id=el('Val').checked?(PICK?PICK[0]:''):'';
 if(el('Val').checked&&!id){m.innerHTML='<div class="err">Elegí el alumno (o destildá "Es un alumno").</div>';return;}
 var V=leerVenta('V',id);if(V.error){m.innerHTML='<div class="err">'+esc(V.error)+'</div>';return;}
 V.params.obs=el('Vob').value.trim();
 if(!confirm('¿Guardar la venta?\n\n'+V.detalle+'\nTotal: '+gs(V.total)+'\n'+V.params.medio+(id?'\nAlumno: '+PICK[1]:'')))return;
 var b=el('Vb');b.disabled=true;b.textContent='Guardando…';
 pedir('venderLibros',V.params,function(r){hecho('Venta guardada en CAJA: '+esc(r.detalle)+' = '+gs(r.total)+(r.nombre?' ('+esc(r.nombre)+')':'')+'.','📚 Otra venta','libros');},
  function(e){b.disabled=false;b.textContent='📚 Guardar venta';falla(e,'Vm');});}
</script></body></html>
