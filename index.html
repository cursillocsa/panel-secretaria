lumno por nombre, apellido o ID…\" autocomplete=\"off\" oninput=\"filtrar()\">\n\u003cdiv id=\"res\">\u003c/div>\u003c/header>\n\u003cmain>\u003cdiv id=\"cola\">\u003c/div>\u003cdiv id=\"pend\">\u003c/div>\u003cdiv id=\"ing\">\u003c/div>\u003cdiv id=\"ficha\">\u003c/div>\u003cdiv id=\"msg\">Cargando…\u003c/div>\u003c/main>\n\u003cscript>\nvar API='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';\nvar PIN='';try{PIN=localStorage.getItem('gaussPinSec')||'';}catch(e){}\nvar L=null,F=null,ULTIMO=null;\n// ⚡ Supabase: copia rápida (solo lectura). Si falla o no está, se usa la planilla como siempre.\nvar SB_URL='https://heycvwxaewjbwbusddqg.supabase.co',SB_KEY='sb_publishable_MpClcQrbgiAtqcsaa5js3w_XCYqHztI';\nvar VER_N=0,TOCADO=false,NUEVO=null;\nfunction sbLeer(tipo,clave,ok,mal){\n if(!PIN){mal();return;}\n var hecho=false,to=setTimeout(function(){if(!hecho){hecho=true;mal();}},4000);\n fetch(SB_URL+'/rest/v1/rpc/gauss_leer',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},\n  body:JSON.stringify({p_pin:PIN,p_tipo:tipo,p_clave:clave})})\n .then(function(r){return r.json();})\n .then(function(d){if(hecho)return;hecho=true;clearTimeout(to);if(d&&d.datos)ok(d.datos,d.t);else mal();})\n .catch(function(){if(hecho)return;hecho=true;clearTimeout(to);mal();});\n}\nfunction estable(o){if(Array.isArray(o))return '['+o.map(estable).join(',')+']';\n if(o&&typeof o==='object')return '{'+Object.keys(o).filter(function(k){return k!=='ultFactura'&&k!=='_ms'&&k!=='_total'&&o[k]!==undefined;}).sort()\n  .map(function(k){return JSON.stringify(k)+':'+estable(o[k]);}).join(',')+'}';\n return JSON.stringify(o);}\nfunction haceCuanto(t){var m=Math.round((Date.now()-new Date(t).getTime())/60000);return isNaN(m)?'':(m\u003c1?'recién':m\u003c60?'hace '+m+' min':'hace '+Math.round(m/60)+' h');}\nfunction marca(h){var m=el('sbMarca');if(m)m.innerHTML=h;}\nfunction numBusca(q,nums){var d=String(q).replace(/\\D/g,'');if(d.length\u003c4||/[a-záéíóúñ]/i.test(q))return false;d=d.replace(/^595/,'').replace(/^0+/,'');if(d.length\u003c3)return false;\n return String(nums||'').split(' ').some(function(t){return t&&t.indexOf(d)>=0;});}   // 🔎 buscar por CI o celular\nfunction el(i){return document.getElementById(i);}\nfunction esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');}\nfunction sa(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}\nfunction gs(n){n=Number(n)||0;return (n\u003c0?'− ':'')+'Gs. '+Math.abs(Math.round(n)).toLocaleString('es-PY');}\nfunction num(s){return Number(String(s).replace(/[^0-9]/g,''))||0;}\nfunction fmt(i){var n=num(i.value);i.value=n?n.toLocaleString('es-PY'):(/0/.test(i.value)?'0':'');}   // se puede escribir 0\nfunction hoyIso(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}\nfunction guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}\n\nfunction pedir(acc,params,ok,mal){\n var q='accion='+acc+'&pin='+encodeURIComponent(PIN);\n for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);\n var t0=Date.now();\n fetch(API+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})\n .then(function(d){if(d&&typeof d==='object')d._total=Date.now()-t0;if(d&&d.error)mal({message:d.error});else ok(d);})\n .catch(function(){mal({message:'No pude conectar con Administración. Revisá la conexión y probá de nuevo.'});});\n}\nfunction error(e){var m=String(e.message||e);\n if(m.indexOf('PIN:')>=0){pedirPin(m.replace(/^.*PIN:\\s*/,''));return;}\n el('msg').innerHTML='\u003cspan class=\"err\">⚠️ '+esc(m)+'\u003c/span>';}\nfunction pedirPin(m){\n el('ficha').innerHTML='\u003cdiv class=\"card\" style=\"text-align:center\">\u003ch2>🔒 Pagos\u003c/h2>'+\n  '\u003cdiv style=\"margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'\">'+esc(m)+'\u003c/div>'+\n  '\u003cinput id=\"pin\" type=\"password\" placeholder=\"PIN\" style=\"font-size:20px;padding:10px;width:170px;text-align:center;border:1px solid #ccc;border-radius:8px\">'+\n  '\u003cbr>\u003cbutton onclick=\"entrar()\" class=\"btn\" style=\"width:auto;display:inline-block;margin-top:12px;padding:10px 28px\">Entrar\u003c/button>\u003c/div>';\n el('msg').textContent='';var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}\nfunction entrar(){PIN=el('pin').value.trim();guardado('gaussPinSec',PIN);el('ficha').innerHTML='';cargar();}\n\nfunction cargar(){el('msg').textContent='Cargando alumnos…';\n function listo(){if(!F)el('msg').textContent=L.alumnos.length+' alumnos. Escribí arriba para buscar.';el('q').focus();cargarPend();cargarIng();colaPoll();}\n sbLeer('pagosLista','todo',function(d){L=d;listo();\n   // confirma con la planilla sin hacer esperar\n   pedir('lista',{},function(d2){L=d2;if(el('res').style.display==='block')filtrar();},function(e){if(String(e.message||'').indexOf('PIN:')>=0)error(e);});},\n  function(){pedir('lista',{},function(d){L=d;listo();},error);});}\nvar PEND=null,ULTFAC='';\nfunction cargarPend(){var ap=function(d){PEND=d.pend;ULTFAC=d.ultFactura||ULTFAC;pintarPend();},pl=function(){pedir('pendFacturas',{},ap,function(){});};\n sbLeer('pagosPend','todo',function(d){ap(d);pl();},pl);}\nfunction pintarPend(){var b=el('pend');if(!PEND||!PEND.length){b.innerHTML='';return;}\n b.innerHTML='\u003cdiv class=\"card y\" style=\"cursor:pointer\" onclick=\"var l=document.getElementById(\\'pendL\\');l.style.display=l.style.display===\\'none\\'?\\'block\\':\\'none\\';\">'+\n  '\u003cb>🧾 '+PEND.length+' pago'+(PEND.length>1?'s':'')+' con FACTURA sin número\u003c/b> \u003cspan class=\"ayuda\">(tocá para ver)\u003c/span>'+\n  '\u003cdiv id=\"pendL\" style=\"display:none;margin-top:8px\">'+PEND.map(function(x){return '\u003cdiv style=\"padding:6px 0;border-top:1px solid #  '<input id="pq" placeholder="Escribí apellido, nombre o ID…" oninput="pBuscar()" autocomplete="off"><div id="pres" class="res"></div><div id="psel"></div></div>';}
function pBuscar(){var q=sa(el('pq').value.trim()),r=el('pres');if(!L||q.length<2){r.innerHTML='';return;}
 var p=q.split(/\s+/),h=L.alumnos.filter(function(x){var t=sa(x[0]+' '+x[1]+' '+x[2]);return p.every(function(w){return t.indexOf(w)>=0;})||numBusca(q,x[5]);}).slice(0,8);
 r.innerHTML=h.length?h.map(function(x){return '<div><span>'+esc(x[1])+'<br><small>'+esc(x[0])+' · '+esc(x[2]||'sin grupo')+' · '+esc(x[3]||'')+'</small></span>'+
  '<button class="mini" onclick="pElegir(\''+esc(x[0])+'\')">Elegir</button></div>';}).join(''):'<div class="ayuda" style="border:0">No aparece.</div>';}
function pElegir(id){var a=L.alumnos.filter(function(x){return x[0]===id;})[0];PICK=a;
 el('pres').innerHTML='';el('pq').value='';
 el('psel').innerHTML='<div class="aviso" style="background:#d9ead3"><b>'+esc(a[1])+'</b><br>'+esc(a[0])+' · '+esc(a[2]||'sin grupo')+' · '+esc(a[3]||'')+'</div>';
 if(PICK_CB)PICK_CB(a);}
var PICK_CB=null;

// ◀ Volver atrás con el gesto del celular (deslizar) o la flecha del navegador: cada pantalla queda en el historial
// ---- 💵 PAGOS DENTRO DE ESTE PANEL (misma pestaña; el botón ⬅ / atrás del celular vuelve acá)
var COBROS_ABIERTO=false;
function cobrosAjustar(){var c=el('cobros'),h=document.querySelector('header');if(c&&h)c.style.top=h.offsetHeight+'px';}
window.addEventListener('resize',cobrosAjustar);
function abrirCobros(id){
 var c=el('cobros');if(!c)return;
 if(!COBROS_ABIERTO){guardarPantalla();COBROS_ABIERTO=true;}
 el('volver').style.display='inline-block';msg('');
 document.querySelector('main').style.display='none';c.style.display='block';cobrosAjustar();window.scrollTo(0,0);
 var f=c.querySelector('iframe');
 var ir=function(){try{if(id&&f.contentWindow&&f.contentWindow.ver)f.contentWindow.ver(id);}catch(e){}};
 if(!f){f=document.createElement('iframe');f.setAttribute('title','Pagos');c.appendChild(f);
  f.onload=function(){f.setAttribute('data-listo','1');setTimeout(ir,300);};f.srcdoc=COBROS_HTML;}
 else if(f.getAttribute('data-listo')){ir();try{f.contentWindow.colaPoll();f.contentWindow.cargarPend();}catch(e){}}
 else{var o=f.onload;f.onload=function(){if(o)o();};}
}
function cerrarCobros(){if(!COBROS_ABIERTO)return;COBROS_ABIERTO=false;var c=el('cobros');if(c)c.style.display='none';document.querySelector('main').style.display='';}
var HIST=[],HIST_OK=!!(window.history&&history.pushState);
function guardarPantalla(){if(!HIST_OK||!el('app'))return;var v=el('volver')?el('volver').style.display:'';
 HIST.push({h:el('app').innerHTML,y:window.scrollY,v:v});if(HIST.length>30)HIST.shift();try{history.pushState({gauss:HIST.length},'');}catch(e){}}
window.addEventListener('popstate',function(){cerrarCobros();if(typeof NAV!=='undefined')NAV++;var s=HIST.pop();
 if(!s||s.v==='none'||s.v===''){HIST=[];inicio(true);return;}
 el('app').innerHTML=s.h;if(el('volver'))el('volver').style.display=s.v;if(typeof msg==='function')msg('');try{if(typeof sbMarca==='function')sbMarca('');}catch(e){}
 setTimeout(function(){window.scrollTo(0,s.y);},0);});
function pantalla(h){guardarPantalla();NAV++;sbMarca('');el('volver').style.display='inline-block';msg('');window.scrollTo(0,0);el('app').innerHTML=h;}
function nonce(){return Date.now()+'-'+Math.random().toString(36).slice(2);}
function hoyIso(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function hecho(t,otra,fn){pantalla('<div class="card ok"><b class="big">✅ '+t+'</b>'+
 '<button class="btn az" onclick="'+fn+'()">'+otra+'</button><button class="btn gr" onclick="inicio()">⬅ Volver al inicio</button></div>');}

 var seguir=function(){
  pantalla(buscadorHtml('¿Qué alumno cambia de grupo?')+'<div id="cg"></div>');
  PICK_CB=function(a){var mods={};FORM.grupos.forEach(function(g){(mods[g.mod||'Otros']=mods[g.mod||'Otros']||[]).push(g);});
   el('cg').innerHTML='<div class="card"><h2><span class="paso">2</span>Grupo nuevo</h2>'+

    '<div class="fila"><div><label>Desde el día <span class="req">*</span></label><input type="date" id="cgF" value="'+hoyIso()+'"></div>'+
    '<div><label>Cuota nueva (Gs.) <span class="ayuda">(vacío = la misma de antes)</span></label><input id="cgC" inputmode="numeric" oninput="fmt(this)"></div></div>'+
    '<div class="ayuda" style="margin-top:8px">La inscripción de antes se cierra ese día y se crea la nueva en el grupo elegido.</div>'+

  el('pq').focus();};
 if(FORM)seguir();else{msg('Cargando…');pedir('formInscripcion',{},function(d){FORM=d;seguir();},function(e){falla(e);});}}
function guardarCambio(){var a=PICK,g=el('cgG').value,m=el('cgM');
 if(!g){m.innerHTML='<div class="err">Elegí el grupo nuevo.</div>';return;}
 if(!el('cgF').value){m.innerHTML='<div class="err">Elegí la fecha.</div>';return;}
 var gn=FORM.grupos.filter(function(x){return x.cod===g;})[0];
 if(!confirm('¿Pasar a '+a[1]+'\nde '+(a[2]||'?')+' a '+gn.nombre+'\ndesde el '+fecha(el('cgF').value)+(num(el('cgC').value)?'\ncon cuota de '+gs(num(el('cgC').value)):'')+'?'))return;

 pedir('cambioGrupo',{id:a[0],grupo:g,fecha:el('cgF').value,cuota:num(el('cgC').value)||''},function(r){
   a[2]=r.grupo;hecho(esc(r.nombre)+' pasó a '+esc(r.grupo)+'.<br><span style="font-weight:normal;font-size:15px">No te olvides de sumarlo al grupo de WhatsApp nuevo.</span>','🔄 Cambiar a otro alumno','cambiarGrupo');},
  function(e){b.disabled=false;b.textContent='🔄 Cambiar de grupo';falla(e,'cgM');});}

// ---------- 🧾 GASTO ----------
var FG=null;
function gasto(){
 var seguir=function(){
  var h='<div class="card"><h2>🧾 Cargar gasto</h2>'+FG.campos.map(function(c){var id='g'+c.j,lab='<label>'+esc(c.titulo)+(/^MONTO/i.test(c.titulo)?' <span class="req">*</span>':'')+'</label>';
   if(c.tipo==='check')return '<label style="font-weight:normal;margin-top:14px"><input type="checkbox" id="'+id+'">'+esc(c.titulo)+'</label>';
   if(c.tipo==='list')return lab+'<select id="'+id+'"><option value=""></option>'+c.ops.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>';
   if(c.tipo==='date')return lab+'<input type="date" id="'+id+'" value="'+(/^FECHA$/i.test(c.titulo)?FG.hoy:'')+'">';
   if(c.tipo==='number')return lab+'<input id="'+id+'" inputmode="numeric" oninput="fmt(this)">';
   return lab+'<input id="'+id+'">';}).join('')+
   '<button class="btn" id="gB" onclick="guardarGasto()">💾 Guardar gasto</button><div id="gM"></div></div>';
  pantalla(h);
  var med=FG.campos.filter(function(c){return /^MEDIO/i.test(c.titulo)&&c.tipo==='list';})[0];
  if(med){var ef=med.ops.filter(function(o){return /efectivo/i.test(o);})[0];if(ef)el('g'+med.j).value=ef;}};
 if(FG)seguir();else{msg('Cargando…');pedir('formGasto',{},function(d){FG=d;seguir();},function(e){falla(e);});}}
function guardarGasto(){var d={},m=el('gM'),monto=0,desc='';
 FG.campos.forEach(function(c){var e=el('g'+c.j);if(!e)return;var v=c.tipo==='check'?e.checked:(c.tipo==='number'?(num(e.value)||''):e.value.trim());
  if(/^MONTO/i.test(c.titulo))monto=num(v);if(/DESCRIP|CATEG/i.test(c.titulo)&&v)desc=desc||v;if(v!==''&&v!==false)d[c.j]=v;});
 if(!monto){m.innerHTML='<div class="err">Falta el monto.</div>';return;}
 if(!confirm('¿Guardar gasto de '+gs(monto)+(desc?' ('+desc+')':'')+'?'))return;
 var b=el('gB');b.disabled=true;b.textContent='Guardando…';
 pedir('gasto',{datos:JSON.stringify(d),nonce:nonce()},function(r){hecho('Gasto de '+gs(r.monto)+' guardado en GASTOS.','🧾 Cargar otro gasto','gasto');},
  function(e){b.disabled=false;b.textContent='💾 Guardar gasto';falla(e,'gM');});}

function baja(){PICK=null;
 var seguir=function(){
  pantalla(buscadorHtml('¿Qué alumno deja el cursillo?')+'<div id="bj"></div>');
  PICK_CB=function(a){el('bj').innerHTML='<div class="card"><h2><span class="paso">2</span>Baja</h2>'+
   '<div class="fila"><div><label>¿Cuándo avisó que ya no viene? <span class="req">*</span></label><input type="date" id="bA" value="'+FB.hoy+'" onchange="bajaPrevia()"></div>'+

   '<div id="bOp" style="margin-top:10px"></div>'+
   '<label>Motivo</label>'+(FB.motivos.length?'<select id="bM"><option value=""></option>'+FB.motivos.map(function(x){return '<option>'+esc(x)+'</option>';}).join('')+'</select>':'<input id="bM">')+
   '<label>Observación <span class="ayuda">(opcional)</span></label><input id="bO">'+
   '<button class="btn" id="bB" onclick="guardarBaja()">🚪 Dar de baja</button><div id="bMsg"></div></div>';

 if(FB)seguir();else{msg('Cargando…');pedir('formBaja',{},function(d){FB=d;seguir();},function(e){falla(e);});}}
// muestra las dos deudas: cortando el último día que vino o el día que avisó
var BP_N=0;
function bajaPrevia(primera){var a=PICK;if(!a||!el('bOp'))return;var n=++BP_N;
 el('bOp').innerHTML='<div class="ayuda">Calculando la deuda…</div>';
 pedir('bajaPrevia',{id:a[0],aviso:el('bA').value,ultima:primera?'':el('bF').value},function(r){if(n!==BP_N||!el('bOp'))return;
  if(primera){if(r.ultimaVez)el('bF').value=r.ultimaVez;el('bUv').textContent=r.ultimaVez?'Según las listas: '+r.ultimaVezTxt+' (se puede cambiar)':'No aparece en las listas: escribila.';}
  var op=function(v,t,d,chk){return '<label style="display:block;font-weight:normal;margin:6px 0;padding:8px;border:1px solid #ddd;border-radius:8px"><input type="radio" name="bCorte" value="'+v+'"'+(chk?' checked':'')+' style="width:auto"> '+t+
   (d===null||d===undefined?' <span class="ayuda">(falta la fecha)</span>':' → debe <b>'+gs(d)+'</b>')+'</label>';};
  el('bOp').innerHTML='<b style="font-size:14px">¿Hasta dónde se cobra?</b>'+
   op('ultima','Cortar el <b>último día que vino</b>'+(el('bF').value?' ('+fecha(el('bF').value)+')':''),r.deudaUlt,true)+
   op('aviso','Cortar el <b>día que avisó</b> ('+fecha(el('bA').value)+')',r.deudaAviso,false);},
  function(e){if(n===BP_N&&el('bOp'))el('bOp').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';});}
function guardarBaja(){var a=PICK,m=el('bMsg'),c=document.querySelector('input[name=bCorte]:checked'),corte=c?c.value:'ultima';
 if(!el('bA').value){m.innerHTML='<div class="err">Falta cuándo avisó.</div>';return;}
 if(!el('bF').value){m.innerHTML='<div class="err">Falta el último día que vino.</div>';return;}
 var f=corte==='aviso'?el('bA').value:el('bF').value;
 if(!confirm('¿Dar de baja a '+a[1]+' ('+(a[2]||'')+')?\n\nAvisó el '+fecha(el('bA').value)+' · vino por última vez el '+fecha(el('bF').value)+
  '\nSe cobra hasta el '+fecha(f)+(corte==='aviso'?' (día que avisó)':' (último día que vino)')))return;
 var b=el('bB');b.disabled=true;b.textContent='Guardando…';
 pedir('baja',{id:a[0],fecha:f,ultima:el('bF').value,aviso:el('bA').value,corte:corte,motivo:el('bM').value,obs:el('bO').value},function(r){a[3]='Salió';
   hecho(esc(r.nombre)+' quedó dado de baja de '+esc(r.grupo)+' desde el '+esc(r.fecha)+'.<br><span style="font-weight:normal;font-size:15px">Acordate de sacarlo del grupo de WhatsApp.</span>','🚪 Dar de baja a otro','baja');},
  function(e){b.disabled=false;b.textContent='🚪 Dar de baja';falla(e,'bMsg');});}

// ---------- 🔔 PARA REVISAR (cambios de grupo y salidas que cargó el CSA) ----------
var REV=null;
function cargarRevisar(){pedir('revisarLista',{},function(d){REV=d.lista||[];if(enInicio()&&L)inicio();},function(){});}
// ---------- 🆕 NOMBRES NUEVOS EN LAS LISTAS (los escribió un profe y no están en Administración) ----------
var NUEVOS=null,NUEVO_INS=null;
function pedirCSA(acc,params,ok,mal){var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 fetch(API_CSA+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar con el CSA. Revisá la conexión y probá de nuevo.'});});}
function cargarNuevos(){pedirCSA('nuevos',{},function(d){NUEVOS=d.lista||[];if(enInicio()&&L)inicio();},function(){});}
function tarjetaNuevos(){return '<div style="background:#eef5fc;border-radius:8px;padding:10px;margin-top:10px"><b>🆕 Nombres nuevos en las listas ('+NUEVOS.length+')</b>'+
 '<div class="ayuda">Un profe los escribió en su lista (salen en celeste) y no están en Administración. Inscribilos o decí qué pasó.</div>'+
 NUEVOS.map(function(x,i){return '<div style="padding:10px 0;border-top:1px solid #cfe2f3"><b>'+esc(x.nombre)+'</b> <span class="ayuda">· '+esc(x.grupo)+' · desde el '+esc(x.desde)+(x.enc?' · encargado: '+esc(x.enc):'')+'</span>'+
  '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'+(x.url?'<a class="mini" style="text-decoration:none;display:inline-block;background:#6fa8dc;color:#fff" href="'+esc(x.url)+'" target="_blank">📋 Ver en la lista</a>':'')+'<button class="mini" onclick="inscribirNuevo('+i+')">📝 Inscribir</button><button class="mini" onclick="nuevoResuelto('+i+')">✅ Ya resuelto</button></div><div id="nv'+i+'"></div></div>';}).join('')+'</div>';}
function inscribirNuevo(i){var x=NUEVOS[i];if(!x)return;inscribir(false);NUEVO_INS=x;
 el('app').insertAdjacentHTML('afterbegin','<div class="card" style="background:#eef5fc;border-left:6px solid #6fa8dc">🆕 Inscribiendo a <b>'+esc(x.nombre)+'</b>, como lo escribió el profe en la lista de <b>'+esc(x.grupo)+'</b>. '+
  'Si ya aparece abajo, tocá "Inscribir a este"; si no, "Es un alumno nuevo" y cargá su nombre completo. Al terminar, en la lista se cambia por el nombre oficial (con sus marcas).</div>');
 el('bq').value=x.nombre;buscar();}
function nuevoResuelto(i){var d=el('nv'+i);if(!d)return;
 d.innerHTML='<div style="background:#fff;border-radius:8px;padding:10px;margin-top:8px"><b>¿Qué pasó con este alumno?</b>'+
  '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="mini" onclick="nuevoEsInscripto('+i+')">🎓 Ya está inscripto</button>'+
  '<button class="mini" style="background:#c0392b;color:#fff;border:0" onclick="nuevoQuitar('+i+')">🚪 No se quedó en el cursillo</button></div><div id="nvR'+i+'"></div></div>';}
function nuevoEsInscripto(i){var r=el('nvR'+i);
 r.innerHTML='<div class="ayuda" style="margin-top:8px">Buscá cuál es (como está en Administración). Su fila de la lista pasa a ese alumno, con las asistencias que ya marcó el profe.</div>'+
  '<input id="nvQ'+i+'" placeholder="Apellido, nombre, ID o cédula…" oninput="nuevoBuscar('+i+')" autocomplete="off" style="margin-top:6px"><div id="nvL'+i+'" class="res"></div>';
 var q=el('nvQ'+i);q.value=NUEVOS[i].nombre.split(' ')[0];nuevoBuscar(i);q.focus();}
function nuevoBuscar(i){var q=sa(val2('nvQ'+i).trim()),r=el('nvL'+i);if(!L||q.length<2){r.innerHTML='';return;}
 var p=q.split(/\s+/),h=L.alumnos.filter(function(x){var t=sa(x[0]+' '+x[1]);return p.every(function(w){return t.indexOf(w)>=0;})||numBusca(q,x[5]);}).slice(0,8);
 r.innerHTML=h.length?h.map(function(x){return '<div><span>'+esc(x[1])+'<br><small>'+esc(x[0])+' · '+esc(x[2]||'sin grupo')+'</small></span><button class="mini" onclick="nuevoResolver('+i+',\'inscripto\',\''+esc(x[0])+'\')">Es este</button></div>';}).join(''):'<div class="ayuda" style="border:0">No aparece. Si no está inscripto, usá 📝 Inscribir.</div>';}
function nuevoQuitar(i){var x=NUEVOS[i];if(!x)return;
 if(!confirm('¿'+x.nombre+' no se quedó en el cursillo?\n\nSe borra su nombre de la lista de '+x.grupo+', con las asistencias que marcó el profe.'))return;nuevoResolver(i,'quitar');}
function nuevoResolver(i,modo,id){var x=NUEVOS[i],r=el('nvR'+i);if(!x)return;
 if(modo==='inscripto'){var a=L.alumnos.filter(function(y){return y[0]===id;})[0];if(!confirm('"'+x.nombre+'" (lista de '+x.grupo+') es '+(a?a[1]:id)+'?'))return;}
 r.innerHTML='<div class="ayuda">Guardando… (unos segundos)</div>';

 var f=String(filtro||'').toLowerCase(),h='';
 var chips='';d.cursos.forEach(function(c){chips+='<span>'+gbEsc(c.curso)+': '+gbN(c.act)+'</span>';});
 h+='<div class="gbTot"><b>'+gbN(d.total)+'</b> alumnos activos en <b>'+d.grupos.length+'</b> '+(d.grupos.length===1?'grupo':'grupos')+(d.anot?' · '+gbN(d.anot)+' anotados para pasar de grupo':'')+'<br><small>Al '+gbEsc(d.hoy||'')+'</small></div><div class="gbChips">'+chips+'</div>';
 h+='<input id="gbF" type="search" placeholder="Buscar grupo…" value="'+gbEsc(filtro||'')+'" oninput="gbPintar(this.value)">';
 var ult=null,sub={},lista=[];
 d.grupos.forEach(function(g){if(f&&(g.nombre+' '+g.curso+' '+g.mod).toLowerCase().indexOf(f)<0)return;lista.push(g);sub[g.curso]=(sub[g.curso]||0)+g.act;});
 lista.forEach(function(g){
  if(g.curso!==ult){ult=g.curso;h+='<div class="gbCurso"><span>'+gbEsc(g.curso)+'</span><span>'+gbN(sub[g.curso])+'</span></div>';}
  var det=[];if(g.mod)det.push(g.mod);if(g.anot)det.push('+'+g.anot+' anotados');if(g.fin)det.push('termina '+g.fin);
  h+='<div class="gbFila"><div>'+gbEsc(g.nombre)+(det.length?'<small>'+gbEsc(det.join(' · '))+'</small>':'')+'</div><b>'+gbN(g.act)+'</b></div>';});
 if(!lista.length)h+='<p>No hay grupos que coincidan.</p>';
 h+='<button class="gbAct" type="button" onclick="gbCargar()">🔄 Actualizar</button>';
 document.getElementById('gbCuerpo').innerHTML=h;
 var inp=document.getElementById('gbF');if(inp&&filtro){inp.focus();try{inp.setSelectionRange(filtro.length,filtro.length);}catch(e){}}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',gbInit);else gbInit();

</script></body></html>
